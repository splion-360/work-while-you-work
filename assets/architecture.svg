<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="800" viewBox="0 0 1500 800" role="img" aria-labelledby="title desc">
  <title id="title">work-while-you-work architecture</title>
  <desc id="desc">Application scoring path and MLflow-backed model lifecycle.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#5b6570"/></marker>
    <style>
      text{font-family:Inter,Arial,sans-serif;fill:#17212b} .lane{fill:#fff;stroke:#aab4be;stroke-width:1.5}.lanehead{fill:#f6f8fa}.label{font-size:13px;font-weight:700;fill:#44515e}.node{stroke-width:1.5}.main{font-size:14px;font-weight:700}.sub{font-size:11px;fill:#44515e}.edge{fill:none;stroke:#5b6570;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1500" height="800" fill="#fff"/>
  <text x="30" y="38" font-size="24" font-weight="700">work-while-you-work: application and model lifecycle</text>
  <rect class="lane" x="30" y="60" width="1440" height="380"/>
  <rect class="lanehead" x="30" y="60" width="1440" height="34"/>
  <text class="label" x="46" y="82">APPLICATION PATH</text>
  <g text-anchor="middle">
    <rect class="node" x="60" y="130" width="130" height="70" rx="5" fill="#e8f1fb" stroke="#4b78a8"/><text class="main" x="125" y="158">Job page</text><text class="sub" x="125" y="179">LinkedIn / ATS</text>
    <rect class="node" x="220" y="130" width="150" height="70" rx="5" fill="#e8f1fb" stroke="#4b78a8"/><text class="main" x="295" y="158">Browser extension</text><text class="sub" x="295" y="179">capture + review</text>
    <rect class="node" x="400" y="130" width="145" height="70" rx="5" fill="#e7f4ec" stroke="#4c8b65"/><text class="main" x="472" y="158">Job tracker API</text><text class="sub" x="472" y="179">validate + persist</text>
    <rect class="node" x="575" y="125" width="130" height="80" rx="5" fill="#fff3d9" stroke="#b98525"/><text class="main" x="640" y="157">SQLite</text><text class="sub" x="640" y="179">snapshots + queue</text>
    <rect class="node" x="735" y="130" width="150" height="70" rx="5" fill="#e7f4ec" stroke="#4c8b65"/><text class="main" x="810" y="158">Scoring worker</text><text class="sub" x="810" y="179">PDF text + hashes</text>
    <rect class="node" x="915" y="130" width="190" height="70" rx="5" fill="#fce9e4" stroke="#b9634f"/><text class="main" x="1010" y="158">Private Hugging Face Space</text><text class="sub" x="1010" y="179">GPU inference</text>
    <rect class="node" x="1260" y="125" width="160" height="80" rx="5" fill="#f2ecf8" stroke="#8362a5"/><text class="main" x="1340" y="157">Notion</text><text class="sub" x="1340" y="179">applications + scores</text>
    <rect class="node" x="825" y="285" width="160" height="66" rx="5" fill="#fce9e4" stroke="#b9634f"/><text class="main" x="905" y="311">BGE-M3</text><text class="sub" x="905" y="331">ColBERT token vectors</text>
    <rect class="node" x="1020" y="285" width="155" height="66" rx="5" fill="#fff3d9" stroke="#b98525"/><text class="main" x="1097" y="322">Similarity matrix</text>
    <rect class="node" x="1210" y="285" width="180" height="66" rx="5" fill="#fff3d9" stroke="#b98525"/><text class="main" x="1300" y="311">K-NRM pooling</text><text class="sub" x="1300" y="331">77 distribution features</text>
    <rect class="node" x="1020" y="370" width="180" height="54" rx="5" fill="#f2ecf8" stroke="#8362a5"/><text class="main" x="1110" y="392">Calibrated classifier</text><text class="sub" x="1110" y="410">fit probability</text>
  </g>
  <path class="edge" d="M190 165H220"/><path class="edge" d="M370 165H400"/><path class="edge" d="M545 165H575"/><path class="edge" d="M705 165H735"/><path class="edge" d="M885 165H915" marker-start="url(#arrow)"/><path class="edge" d="M810 200V255H1340V205"/>
  <path class="edge" d="M472 130V108H1340V125" stroke-dasharray="6 5"/><text class="sub" x="900" y="104" text-anchor="middle">application row</text><text class="sub" x="1120" y="250" text-anchor="middle">validated score</text>
  <path class="edge" d="M1010 200V250H905V285"/><path class="edge" d="M985 318H1020"/><path class="edge" d="M1175 318H1210"/><path class="edge" d="M1300 351V397H1200"/><path class="edge" d="M1110 370V240H1040V200"/>
  <rect class="lane" x="30" y="470" width="1440" height="290"/>
  <rect class="lanehead" x="30" y="470" width="1440" height="34"/>
  <text class="label" x="46" y="492">MODEL LIFECYCLE</text>
  <g text-anchor="middle">
    <rect class="node" x="75" y="560" width="185" height="70" rx="5" fill="#e8f1fb" stroke="#4b78a8"/><text class="main" x="167" y="588">Labeled resume/JD pairs</text><text class="sub" x="167" y="609">graph-disjoint splits</text>
    <rect class="node" x="320" y="560" width="185" height="70" rx="5" fill="#e7f4ec" stroke="#4c8b65"/><text class="main" x="412" y="588">Train + calibrate</text><text class="sub" x="412" y="609">linear 77 → 2 classifier</text>
    <rect class="node" x="565" y="550" width="215" height="90" rx="5" fill="#f2ecf8" stroke="#8362a5"/><text class="main" x="672" y="581">MLflow</text><text class="sub" x="672" y="603">runs · metrics · artifacts</text><text class="sub" x="672" y="620">model registry + champion alias</text>
    <rect class="node" x="840" y="560" width="220" height="70" rx="5" fill="#fff3d9" stroke="#b98525"/><text class="main" x="950" y="588">Versioned model bundle</text><text class="sub" x="950" y="609">hashes + calibration + threshold</text>
    <rect class="node" x="1120" y="560" width="190" height="70" rx="5" fill="#fce9e4" stroke="#b9634f"/><text class="main" x="1215" y="588">Hugging Face release</text><text class="sub" x="1215" y="609">pinned revision</text>
    <rect class="node" x="565" y="675" width="215" height="60" rx="5" fill="#e7f4ec" stroke="#4c8b65"/><text class="main" x="672" y="700">Optional local GPU engine</text><text class="sub" x="672" y="719">loads MLflow champion</text>
  </g>
  <path class="edge" d="M260 595H320"/><path class="edge" d="M505 595H565"/><path class="edge" d="M780 595H840"/><path class="edge" d="M1060 595H1120"/><path class="edge" d="M672 640V675"/>
</svg>
