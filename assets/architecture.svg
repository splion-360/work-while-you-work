<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">BGE-M3-based resume and job-description scoring model training</title>
  <desc id="desc">Exploded model-development flow from graph-disjoint data splits through frozen BGE-M3 token vectors, K-NRM features, fold training, calibration, outer testing, MLflow tracking, and model packaging.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#5b6570"/></marker>
    <style>
      text{font-family:Inter,Arial,sans-serif;fill:#17212b}.section{fill:#f6f8fa;stroke:#aab4be;stroke-width:1.5}.section-title{font-size:13px;font-weight:700;fill:#44515e}.node{stroke-width:1.5}.main{font-size:13px;font-weight:700}.sub{font-size:10.5px;fill:#44515e}.edge{fill:none;stroke:#5b6570;stroke-width:2;marker-end:url(#arrow)}.support{fill:none;stroke:#8362a5;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#arrow)}.note{font-size:10.5px;fill:#596674;font-style:italic}
    </style>
  </defs>
  <rect width="1600" height="1040" fill="#fff"/>
  <text x="30" y="38" font-size="24" font-weight="700">BGE-M3-based resume/JD scoring model training</text>
  <text x="30" y="60" font-size="12" fill="#596674">BGE-M3 is frozen. This project trains and calibrates the downstream fit classifier.</text>

  <rect class="section" x="25" y="85" width="330" height="390" rx="3"/>
  <text class="section-title" x="42" y="112">1 · DATASET AND LEAKAGE CONTROL</text>
  <g text-anchor="middle">
    <rect class="node" x="75" y="140" width="220" height="62" rx="5" fill="#e8f1fb" stroke="#4b78a8"/>
    <text class="main" x="185" y="166">Labeled resume/JD pairs</text><text class="sub" x="185" y="186">No Fit · Potential Fit · Good Fit</text>
    <rect class="node" x="48" y="245" width="125" height="62" rx="5" fill="#e8f1fb" stroke="#4b78a8"/>
    <text class="main" x="110" y="271">Resume corpus</text><text class="sub" x="110" y="290">normalized + hashed</text>
    <rect class="node" x="202" y="245" width="125" height="62" rx="5" fill="#e8f1fb" stroke="#4b78a8"/>
    <text class="main" x="264" y="271">JD corpus</text><text class="sub" x="264" y="290">normalized + hashed</text>
    <rect class="node" x="75" y="350" width="220" height="76" rx="5" fill="#fff3d9" stroke="#b98525"/>
    <text class="main" x="185" y="376">Graph-disjoint 3-fold split</text><text class="sub" x="185" y="396">near-duplicate resume and JD clusters</text><text class="sub" x="185" y="412">remain in one fold</text>
  </g>
  <path class="edge" d="M185 202V222H110V245"/><path class="edge" d="M185 202V222H264V245"/>
  <path class="edge" d="M110 307V330H185V350"/><path class="edge" d="M264 307V330H185V350"/>

  <rect class="section" x="380" y="85" width="510" height="390" rx="3"/>
  <text class="section-title" x="397" y="112">2 · SHARED FROZEN BGE-M3 ENCODER</text>
  <g text-anchor="middle">
    <rect class="node" x="410" y="150" width="120" height="54" rx="5" fill="#e8f1fb" stroke="#4b78a8"/><text class="main" x="470" y="174">Resume text</text><text class="sub" x="470" y="191">up to 8,192 tokens</text>
    <rect class="node" x="410" y="345" width="120" height="54" rx="5" fill="#e8f1fb" stroke="#4b78a8"/><text class="main" x="470" y="369">JD text</text><text class="sub" x="470" y="386">up to 8,192 tokens</text>
    <rect class="node" x="570" y="150" width="120" height="54" rx="5" fill="#fce9e4" stroke="#b9634f"/><text class="main" x="630" y="174">Tokenizer</text><text class="sub" x="630" y="191">shared vocabulary</text>
    <rect class="node" x="570" y="345" width="120" height="54" rx="5" fill="#fce9e4" stroke="#b9634f"/><text class="main" x="630" y="369">Tokenizer</text><text class="sub" x="630" y="386">shared vocabulary</text>
    <rect class="node" x="730" y="220" width="135" height="108" rx="5" fill="#fce9e4" stroke="#b9634f"/><text class="main" x="797" y="249">BGE-M3</text><text class="sub" x="797" y="270">shared transformer</text><text class="sub" x="797" y="288">ColBERT projection</text><text class="sub" x="797" y="306">weights frozen</text>
    <rect class="node" x="570" y="235" width="120" height="78" rx="5" fill="#f2ecf8" stroke="#8362a5"/><text class="main" x="630" y="261">Model contract</text><text class="sub" x="630" y="280">revision + file hash</text><text class="sub" x="630" y="297">encoder fingerprint</text>
    <rect class="node" x="730" y="130" width="135" height="58" rx="5" fill="#e7f4ec" stroke="#4c8b65"/><text class="main" x="797" y="154">Resume matrix R</text><text class="sub" x="797" y="173">normalized token vectors</text>
    <rect class="node" x="730" y="360" width="135" height="58" rx="5" fill="#e7f4ec" stroke="#4c8b65"/><text class="main" x="797" y="384">JD matrix J</text><text class="sub" x="797" y="403">normalized token vectors</text>
  </g>
  <path class="edge" d="M530 177H570"/><path class="edge" d="M530 372H570"/>
  <path class="edge" d="M690 177H705V239H730"/><path class="edge" d="M690 372H705V309H730"/>
  <path class="support" d="M690 274H730"/>
  <path class="edge" d="M797 220V188"/><path class="edge" d="M797 328V360"/>

  <rect class="section" x="915" y="85" width="660" height="390" rx="3"/>
  <text class="section-title" x="932" y="112">3 · TOKEN INTERACTION AND FEATURE MATERIALIZATION</text>
  <g text-anchor="middle">
    <rect class="node" x="950" y="145" width="180" height="68" rx="5" fill="#e7f4ec" stroke="#4c8b65"/><text class="main" x="1040" y="172">Token interaction</text><text class="sub" x="1040" y="192">S = J × Rᵀ</text>
    <rect class="node" x="1180" y="145" width="165" height="68" rx="5" fill="#fff3d9" stroke="#b98525"/><text class="main" x="1262" y="172">11 Gaussian kernels</text><text class="sub" x="1262" y="192">soft-match similarity bands</text>
    <rect class="node" x="1390" y="145" width="155" height="68" rx="5" fill="#fff3d9" stroke="#b98525"/><text class="main" x="1467" y="166">Per-JD-token</text><text class="sub" x="1467" y="185">length-normalized</text><text class="sub" x="1467" y="200">log soft counts</text>
    <rect class="node" x="1270" y="275" width="180" height="82" rx="5" fill="#fff3d9" stroke="#b98525"/><text class="main" x="1360" y="300">7 distribution statistics</text><text class="sub" x="1360" y="319">mean · std · min · quartiles</text><text class="sub" x="1360" y="337">median · max</text>
    <rect class="node" x="1030" y="285" width="170" height="62" rx="5" fill="#f2ecf8" stroke="#8362a5"/><text class="main" x="1115" y="311">77 pair features</text><text class="sub" x="1115" y="331">11 kernels × 7 statistics</text>
    <rect class="node" x="1030" y="380" width="170" height="62" rx="5" fill="#e8f1fb" stroke="#4b78a8"/><text class="main" x="1115" y="402">Binary target</text><text class="sub" x="1115" y="419">No Fit / Good Fit</text><text class="sub" x="1115" y="434">Potential Fit maps to Good Fit</text>
  </g>
  <path class="edge" d="M865 159H915V179H950"/><path class="edge" d="M865 389H915V179H950"/>
  <path class="edge" d="M1130 179H1180"/><path class="edge" d="M1345 179H1390"/><path class="edge" d="M1467 213V245H1360V275"/><path class="edge" d="M1270 316H1200"/>
  <path class="edge" d="M295 388H360V445H995V411H1030"/>
  <path class="edge" d="M173 276H370V177H410"/><path class="edge" d="M327 276H370V372H410"/>

  <rect class="section" x="25" y="500" width="1550" height="505" rx="3"/>
  <text class="section-title" x="42" y="527">4 · FOLD TRAINING, CALIBRATION, AND MODEL SELECTION</text>
  <g text-anchor="middle">
    <rect class="node" x="65" y="575" width="165" height="68" rx="5" fill="#e8f1fb" stroke="#4b78a8"/><text class="main" x="147" y="602">Fold-aware examples</text><text class="sub" x="147" y="622">77 features + binary label</text>
    <rect class="node" x="285" y="555" width="180" height="74" rx="5" fill="#fff3d9" stroke="#b98525"/><text class="main" x="375" y="581">Train partition</text><text class="sub" x="375" y="601">inner graph-disjoint split</text><text class="sub" x="375" y="616">fit scaler on train only</text>
    <rect class="node" x="285" y="680" width="180" height="66" rx="5" fill="#fff3d9" stroke="#b98525"/><text class="main" x="375" y="706">Inner validation</text><text class="sub" x="375" y="726">checkpoint selection</text>
    <rect class="node" x="285" y="825" width="180" height="66" rx="5" fill="#e8f1fb" stroke="#4b78a8"/><text class="main" x="375" y="851">Outer test</text><text class="sub" x="375" y="871">untouched until evaluation</text>
    <rect class="node" x="535" y="555" width="175" height="74" rx="5" fill="#e7f4ec" stroke="#4c8b65"/><text class="main" x="622" y="581">Linear classifier</text><text class="sub" x="622" y="601">standardized 77 → 2 logits</text><text class="sub" x="622" y="616">trained per outer fold</text>
    <rect class="node" x="535" y="680" width="175" height="66" rx="5" fill="#f2ecf8" stroke="#8362a5"/><text class="main" x="622" y="706">Platt calibration</text><text class="sub" x="622" y="726">fit on inner validation</text>
    <rect class="node" x="775" y="680" width="185" height="66" rx="5" fill="#f2ecf8" stroke="#8362a5"/><text class="main" x="867" y="706">Threshold selection</text><text class="sub" x="867" y="726">maximize validation macro F1</text>
    <rect class="node" x="775" y="825" width="185" height="66" rx="5" fill="#e7f4ec" stroke="#4c8b65"/><text class="main" x="867" y="851">Outer-fold evaluation</text><text class="sub" x="867" y="871">calibrated held-out metrics</text>
    <rect class="node" x="1030" y="555" width="205" height="94" rx="5" fill="#f2ecf8" stroke="#8362a5"/><text class="main" x="1132" y="579">MLflow</text><text class="sub" x="1132" y="599">parent run + nested fold runs</text><text class="sub" x="1132" y="617">params · epoch metrics</text><text class="sub" x="1132" y="633">checkpoints · evaluation artifacts</text>
    <rect class="node" x="1030" y="800" width="205" height="78" rx="5" fill="#fff3d9" stroke="#b98525"/><text class="main" x="1132" y="826">Select classifier fold</text><text class="sub" x="1132" y="846">highest inner-validation</text><text class="sub" x="1132" y="862">macro F1</text>
    <rect class="node" x="1310" y="755" width="220" height="130" rx="5" fill="#fce9e4" stroke="#b9634f"/><text class="main" x="1420" y="782">Versioned model bundle</text><text class="sub" x="1420" y="804">classifier checkpoint + SHA-256</text><text class="sub" x="1420" y="822">scaler · Platt parameters</text><text class="sub" x="1420" y="840">decision threshold</text><text class="sub" x="1420" y="858">BGE-M3 fingerprint</text><text class="sub" x="1420" y="876">feature contract</text>
  </g>
  <path class="edge" d="M1200 316H1235V540H147V575"/>
  <path class="edge" d="M1200 411H1260V550H230V609"/>
  <path class="edge" d="M230 609H260V592H285"/><path class="edge" d="M230 609H260V713H285"/><path class="edge" d="M230 609H260V858H285"/>
  <path class="edge" d="M465 592H535"/><path class="edge" d="M622 629V655H500V713H535"/>
  <path class="edge" d="M465 713H535"/><path class="edge" d="M710 713H775"/>
  <path class="edge" d="M465 858H775"/><path class="edge" d="M867 746V825"/>
  <path class="edge" d="M710 592H1000V602H1030"/><path class="support" d="M960 858H1000V625H1030"/>
  <path class="edge" d="M465 713V775H1000V839H1030"/><path class="edge" d="M1235 839H1310"/>
  <text class="note" x="500" y="908">Outer-test labels never select the checkpoint, calibrator, or threshold.</text>
</svg>
