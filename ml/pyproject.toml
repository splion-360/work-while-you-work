[project]
name = "resume-jd-scoring"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "datasets>=4.0",
  "flagembedding==1.4.2",
  "matplotlib>=3.10",
  "mlflow>=3,<4",
  "pyarrow>=21.0",
  "rapidfuzz>=3.0",
  "scikit-learn>=1.7",
  "sentence-transformers==5.1.0",
  "torch==2.6.0",
  "tqdm>=4.67",
  "transformers>=4.57.1,<4.58",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.12",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
